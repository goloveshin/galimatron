// directory paths are absolute or relative to this config file (unless stated otherwise)
{
    "galimatron" : {
        "input-gal-dir" : "incoming_gal/",
        "output-gal-dir" : "actual_gal/",
        "intermediate-xml-dir" : "actual_xml/",
        "intermediate-log-dir" : "intermediate/",
        "intermediate-summary-dir" : "actual_summary/"
    },
    "saxon-processor" : {
        "working-dir" : "xslt/",
        "config-file" : "config.xml" // if relative, then relative to saxon-processor.working-dir
    },
    "transforms" : {
        "language-transforms" : {
            "buildin-transforms" : {
            },
            "user-transforms" : {
                "transforms" : [
                    {
                        "name" : "generate uuid",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "generate-uuid.xsl", // relative to saxon-processor.working-dir
                                "parameters" : [
                                    {
                                        "name" : "new_uuid",
                                        "value" : "11111111-2222-4333-a444-555555555555"
                                    }
                                ]
                            }
                        },
                        "output" : {
                            "principal-xml" : {
                                "file" : "generate-uuid.xml" // relative to galimatron.intermediate-xml-dir
                            }
                        }
                    }
                ]
            }
        },
        "post-language-transforms" : {
            "user-transforms" : {
                "transforms" : []
            }
        }
    }
}
