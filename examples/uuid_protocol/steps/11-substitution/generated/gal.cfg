// directory paths are absolute, or relative to this config (unless noted)
{
    "galimatron" : {
        "input-gal-dir" : "incoming_gal/",
        "output-gal-dir" : "actual_gal/",
        "intermediate-xml-dir" : "intermediate/",
        "intermediate-log-dir" : "intermediate/",
        "intermediate-summary-dir" : "intermediate/",
        "committed-report" : true
    },
    "saxon-processor" : {
        "working-dir" : "xslt/",
        "config-file" : "config.xml"
    },
    "transforms" : {
        "language-transforms" : {
            "buildin-transforms" : {
            },
            "user-transforms" : {
                "transforms" : [
                    {
                        "name" : "next uuid for wizard copies",
                        "user-data-for-info" : "uuid xslt unchanged: the message id stays and the version counter adds one",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "generate-uuid.xsl",
                                "parameters" : []
                            }
                        },
                        "output" : {
                            // no file: the result stays in memory for the next transform and is not written
                            "principal-xml" : {
                            }
                        }
                    },
                    {
                        "name" : "fill the dictionary",
                        "user-data-for-info" : "an entry for each tag name that is not already in the dictionary, in the open version",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "fill-dictionary.xsl",
                                "parameters" : []
                            }
                        },
                        "output" : {
                            // no file: the result stays in memory for the next transform and is not written
                            "principal-xml" : {
                            }
                        }
                    }
                ]
            }
        },
        "post-language-transforms" : {
            "user-transforms" : {
                "transforms" : [
                    {
                        "name" : "generate history.html",
                        "user-data-for-info" : "the history element of the compiled document, one version at a time",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "history-page.xsl",
                                "parameters" : []
                            }
                        },
                        "output" : {
                            // no file: the primary result is not written
                            "principal-xml" : {
                            },
                            "other-files" : [
                                {
                                    "store-dir" : "intermediate/",
                                    "store-dir-string-alias" : "history",
                                    "extentions" : [".html"],
                                    "replace-escaped-form-to-original-symbols" : false,
                                    "delete-if-not-rewrited" : true
                                }
                            ]
                        }
                    },
                    {
                        "name" : "generate dictionary.md",
                        "user-data-for-info" : "copies the compiled document through, so this stays before the source xslt",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "generate-dictionary.xsl",
                                "parameters" : []
                            }
                        },
                        "output" : {
                            // no file: the primary result is not written
                            "principal-xml" : {
                            },
                            "other-files" : [
                                {
                                    "store-dir" : "dictionary/",
                                    "store-dir-string-alias" : "dictionary",
                                    "extentions" : [".md"],
                                    "replace-escaped-form-to-original-symbols" : false,
                                    "delete-if-not-rewrited" : true
                                }
                            ]
                        }
                    },
                    {
                        "name" : "generate .hpp/.cpp",
                        "user-data-for-info" : "version 6 stays unpublished, so the generated sources stay the published versions",
                        "input" : {
                            "principal-xsl" : {
                                "file" : "generate-sources.xsl",
                                "parameters" : [
                                    {
                                        "name" : "protocol_name",
                                        "value" : "UUID Protocol 11"
                                    }
                                ]
                            }
                        },
                        "output" : {
                            // no file: the primary result is not written
                            "principal-xml" : {
                            },
                            "other-files" : [
                                {
                                    "store-dir" : "actual_gal/",
                                    "store-dir-string-alias" : "conversion-state",
                                    "extentions" : [".xml"],
                                    "replace-escaped-form-to-original-symbols" : true,
                                    "delete-if-not-rewrited" : true
                                },
                                {
                                    "store-dir" : "generated_dto/",
                                    "store-dir-string-alias" : "generated-dto",
                                    "extentions" : [".hpp", ".cpp"],
                                    "replace-escaped-form-to-original-symbols" : true,
                                    "delete-if-not-rewrited" : true
                                },
                                {
                                    "store-dir" : "generated_conversion/",
                                    "store-dir-string-alias" : "generated-conversion",
                                    "extentions" : [".hpp", ".cpp"],
                                    "replace-escaped-form-to-original-symbols" : true,
                                    "delete-if-not-rewrited" : false
                                }
                            ]
                        }
                    }
                ]
            }
        }
    }
}
